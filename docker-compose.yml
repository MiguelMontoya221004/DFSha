# DFSha completo en Docker: 3 ControlNodes con Raft + 4 DataNodes en 3 zonas +
# un contenedor con el cliente.
#
#   cd deploy && docker compose up -d --build
#   docker compose exec client dfsha register ana
#   docker compose exec client dfsha login ana
#   docker compose exec client dfsha put /datos/archivo.bin
#
# El cliente habla con cn1 (cualquiera de los tres responde) y con los DataNodes
# directamente, que es por donde van los bloques.
name: dfsha

x-secretos: &secretos
  # Los mismos valores en los tres ControlNodes y en los DataNodes
  DFSHA_BLOCK_SECRET: ${DFSHA_BLOCK_SECRET:-clave-hmac-compartida-con-los-datanodes}

x-controlnode: &controlnode
  build:
    context: .
    dockerfile: controlnode/Dockerfile
  image: dfsha/controlnode:1.0.0
  networks: [dfsha]
  command: >
    --dfsha.raft.peers=n1|cn1:9501,n2|cn2:9501,n3|cn3:9501
    --dfsha.controlnodes=http://cn1:8443,http://cn2:8443,http://cn3:8443
    --dfsha.storage-dir=/app/data
    --dfsha.block-secret=${DFSHA_BLOCK_SECRET:-clave-hmac-compartida-con-los-datanodes}

x-datanode: &datanode
  build:
    context: .
    dockerfile: datanode/Dockerfile
  image: dfsha/datanode:0.4.0
  networks: [dfsha]
  depends_on:
    cn1:
      condition: service_healthy

services:
  # ------------------------- plano de control -------------------------
  cn1:
    <<: *controlnode
    container_name: dfsha-cn1
    command: >
      --dfsha.node-id=n1
      --dfsha.raft.peers=n1|cn1:9501,n2|cn2:9501,n3|cn3:9501
      --dfsha.controlnodes=http://cn1:8443,http://cn2:8443,http://cn3:8443
      --dfsha.storage-dir=/app/data
      --spring.datasource.url=jdbc:h2:file:/app/data/n1/meta;DB_CLOSE_DELAY=-1
    ports:
      - "8443:8443"      # API REST para el cliente
    volumes:
      - cn1-data:/app/data

  cn2:
    <<: *controlnode
    container_name: dfsha-cn2
    command: >
      --dfsha.node-id=n2
      --dfsha.raft.peers=n1|cn1:9501,n2|cn2:9501,n3|cn3:9501
      --dfsha.controlnodes=http://cn1:8443,http://cn2:8443,http://cn3:8443
      --dfsha.storage-dir=/app/data
      --spring.datasource.url=jdbc:h2:file:/app/data/n2/meta;DB_CLOSE_DELAY=-1
    ports:
      - "8444:8443"
    volumes:
      - cn2-data:/app/data

  cn3:
    <<: *controlnode
    container_name: dfsha-cn3
    command: >
      --dfsha.node-id=n3
      --dfsha.raft.peers=n1|cn1:9501,n2|cn2:9501,n3|cn3:9501
      --dfsha.controlnodes=http://cn1:8443,http://cn2:8443,http://cn3:8443
      --dfsha.storage-dir=/app/data
      --spring.datasource.url=jdbc:h2:file:/app/data/n3/meta;DB_CLOSE_DELAY=-1
    ports:
      - "8445:8443"
    volumes:
      - cn3-data:/app/data

  # -------------------------- plano de datos --------------------------
  dn1:
    <<: *datanode
    container_name: dfsha-dn1
    environment:
      <<: *secretos
      DFSHA_NODE_ID: dn-1
      DFSHA_HOST: dn1
      DFSHA_CLIENT_PORT: 9001
      DFSHA_ZONE: zona-a
      DFSHA_CONTROLNODES: cn1:50051,cn2:50051,cn3:50051
      DFSHA_CAPACITY_BYTES: 8589934592
    ports: ["9001:9001"]
    volumes:
      - dn1-data:/var/lib/dfsha/blocks

  dn2:
    <<: *datanode
    container_name: dfsha-dn2
    environment:
      <<: *secretos
      DFSHA_NODE_ID: dn-2
      DFSHA_HOST: dn2
      DFSHA_CLIENT_PORT: 9001
      DFSHA_ZONE: zona-a
      DFSHA_CONTROLNODES: cn1:50051,cn2:50051,cn3:50051
      DFSHA_CAPACITY_BYTES: 8589934592
    ports: ["9002:9001"]
    volumes:
      - dn2-data:/var/lib/dfsha/blocks

  dn3:
    <<: *datanode
    container_name: dfsha-dn3
    environment:
      <<: *secretos
      DFSHA_NODE_ID: dn-3
      DFSHA_HOST: dn3
      DFSHA_CLIENT_PORT: 9001
      DFSHA_ZONE: zona-b
      DFSHA_CONTROLNODES: cn1:50051,cn2:50051,cn3:50051
      DFSHA_CAPACITY_BYTES: 8589934592
    ports: ["9003:9001"]
    volumes:
      - dn3-data:/var/lib/dfsha/blocks

  dn4:
    <<: *datanode
    container_name: dfsha-dn4
    environment:
      <<: *secretos
      DFSHA_NODE_ID: dn-4
      DFSHA_HOST: dn4
      DFSHA_CLIENT_PORT: 9001
      DFSHA_ZONE: zona-c
      DFSHA_CONTROLNODES: cn1:50051,cn2:50051,cn3:50051
      DFSHA_CAPACITY_BYTES: 8589934592
    ports: ["9004:9001"]
    volumes:
      - dn4-data:/var/lib/dfsha/blocks

  # ------------------------------ cliente ------------------------------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: dfsha/client:0.4.0
    container_name: dfsha-client
    depends_on: [cn1]
    environment:
      DFSHA_CONTROLNODE_URL: http://cn1:8443
    command: ["-c", "sleep infinity"]
    volumes:
      - ./datos:/datos        # carpeta local para subir y bajar archivos
    networks: [dfsha]

networks:
  dfsha:
    driver: bridge

volumes:
  cn1-data:
  cn2-data:
  cn3-data:
  dn1-data:
  dn2-data:
  dn3-data:
  dn4-data:
