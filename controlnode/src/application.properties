# ======================= DFSha - ControlNode =======================
# Identidad de ESTE nodo. Para levantar los otros dos se arranca el mismo
# jar con:  --dfsha.node-id=n2 --server.port=8444
dfsha.node-id=n1
server.port=8443
# Puerto gRPC donde atiende a los DataNodes (contrato en src/dfsha.proto)
dfsha.grpc-port=50051

# ---------------------- Cluster Raft (Apache Ratis) ----------------
# Lista de los 3 ControlNodes:  id|host:puertoRaft
dfsha.raft.peers=n1|127.0.0.1:9501,n2|127.0.0.1:9502,n3|127.0.0.1:9503
dfsha.raft.group-id=9c7c3f52-0b37-4a7a-8f4a-1d3a0a5c7e01
dfsha.storage-dir=./data

# ---------------------- Parametros del sistema ---------------------
dfsha.block-size=4194304
dfsha.replication=3
dfsha.lease-seconds=60
# Si un DataNode no manda heartbeat en este tiempo se considera caido
dfsha.heartbeat-timeout-seconds=10

# ---------------------- Secretos -----------------------------------
# En el despliegue real estos valores se pasan por variable de entorno.
dfsha.jwt-secret=clave-de-firma-jwt-de-al-menos-32-caracteres
dfsha.jwt-minutes=120
# Secreto compartido con los DataNodes para firmar los tokens de bloque
dfsha.block-secret=clave-hmac-compartida-con-los-datanodes

# ---------------------- Base de datos local ------------------------
spring.datasource.url=jdbc:h2:file:./data/${dfsha.node-id}/meta;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# ---------------------- TLS (se activa en el Hito 3) ---------------
#server.ssl.enabled=true
#server.ssl.key-store=file:./certs/controlnode.p12
#server.ssl.key-store-password=changeit
#server.ssl.key-store-type=PKCS12
#server.ssl.enabled-protocols=TLSv1.3

logging.level.org.apache.ratis=WARN

# Direcciones REST de los 3 ControlNodes. Se le entregan al DataNode cuando se
# registra, porque el heartbeat se le manda a TODOS (igual que en HDFS HA): asi
# cualquiera de los 3 sabe que DataNodes estan vivos y puede atender al cliente
# aunque no sea el lider.
dfsha.controlnodes=http://127.0.0.1:8443,http://127.0.0.1:8444,http://127.0.0.1:8445
