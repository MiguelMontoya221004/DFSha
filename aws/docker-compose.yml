name: dfsha

services:
  controlnode:
    image: tinez2232/dfsha-controlnode:1.0
    container_name: dfsha-cn
    network_mode: host
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
    # OJO: el command va como LISTA, no como texto. Si se escribe como texto,
    # Compose lo parte como una linea de shell y se rompen el "|" de los peers
    # de Raft y el ";" de la URL de H2.
    command:
      - --dfsha.node-id=${DFSHA_NODE_ID:?falta DFSHA_NODE_ID}
      - --server.port=8443
      - --dfsha.grpc-port=50051
      - --dfsha.raft.peers=${DFSHA_RAFT_PEERS:?falta DFSHA_RAFT_PEERS}
      - --dfsha.controlnodes=${DFSHA_CN_REST}
      - --dfsha.storage-dir=/app/data
      - --dfsha.block-secret=${DFSHA_BLOCK_SECRET:?falta DFSHA_BLOCK_SECRET}
      - --dfsha.jwt-secret=${DFSHA_JWT_SECRET:?falta DFSHA_JWT_SECRET}
      - --spring.datasource.url=jdbc:h2:file:/app/data/${DFSHA_NODE_ID}/meta;DB_CLOSE_DELAY=-1
    volumes:
      - cn-data:/app/data

  datanode1:
    image: tinez2232/dfsha-datanode:0.4
    container_name: dfsha-dn1
    network_mode: host
    restart: unless-stopped
    environment:
      DFSHA_NODE_ID: ${DFSHA_ZONE}-1
      DFSHA_HOST: ${DFSHA_PUBLIC_IP:?falta DFSHA_PUBLIC_IP}
      DFSHA_CLIENT_PORT: 9001
      DFSHA_PEER_PORT: 9011
      DFSHA_ZONE: ${DFSHA_ZONE:?falta DFSHA_ZONE}
      DFSHA_CONTROLNODES: ${DFSHA_CN_GRPC:?falta DFSHA_CN_GRPC}
      DFSHA_BLOCK_SECRET: ${DFSHA_BLOCK_SECRET:?falta DFSHA_BLOCK_SECRET}
      DFSHA_CAPACITY_BYTES: 3221225472
    volumes:
      - dn1-data:/var/lib/dfsha/blocks

  datanode2:
    image: tinez2232/dfsha-datanode:0.4
    container_name: dfsha-dn2
    network_mode: host
    restart: unless-stopped
    environment:
      DFSHA_NODE_ID: ${DFSHA_ZONE}-2
      DFSHA_HOST: ${DFSHA_PUBLIC_IP:?falta DFSHA_PUBLIC_IP}
      DFSHA_CLIENT_PORT: 9002
      DFSHA_PEER_PORT: 9012
      DFSHA_ZONE: ${DFSHA_ZONE:?falta DFSHA_ZONE}
      DFSHA_CONTROLNODES: ${DFSHA_CN_GRPC:?falta DFSHA_CN_GRPC}
      DFSHA_BLOCK_SECRET: ${DFSHA_BLOCK_SECRET:?falta DFSHA_BLOCK_SECRET}
      DFSHA_CAPACITY_BYTES: 3221225472
    volumes:
      - dn2-data:/var/lib/dfsha/blocks

volumes:
  cn-data:
  dn1-data:
  dn2-data:
